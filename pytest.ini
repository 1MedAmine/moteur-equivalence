[pytest]
# `basetemp` est fixe parce que le defaut systeme (%TEMP%\pytest-of-<user>)
# est refuse en ecriture dans certains environnements. Calcule dans
# `conftest.py`, pas ici : `addopts` ne sait pas composer un chemin absolu
# a partir de l'emplacement de ce fichier.
testpaths = tests
addopts = -p no:cacheprovider
