name: Suite de tests

# La suite tourne sans clé d'API, sans base de données et sans réseau
# sortant. Aucun secret n'est fourni à ce job, et aucun service n'est
# démarré : si un test avait besoin de l'un des trois, il échouerait ici,
# ce qui est exactement le but.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: moteur d'équivalence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lancer la suite
        # Aucune variable d'environnement n'est posée : ni clé, ni URL
        # d'instance de recherche. La suite doit tenir debout sans rien.
        run: python -m pytest -q
